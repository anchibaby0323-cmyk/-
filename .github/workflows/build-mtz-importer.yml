name: Build MTZ Importer APK

on:
  push:
    branches:
      - themestore-mtz-importer
    paths:
      - 'ThemeStore-MTZ-Importer/**'
      - '.github/workflows/build-mtz-importer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ThemeStore-MTZ-Importer
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp ThemeStore-MTZ-Importer/app/build/outputs/apk/debug/app-debug.apk out/ThemeStore-MTZ-Importer-experimental.apk
          sha256sum out/ThemeStore-MTZ-Importer-experimental.apk | tee out/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThemeStore-MTZ-Importer-experimental
          path: out/*
          if-no-files-found: error
          retention-days: 14
