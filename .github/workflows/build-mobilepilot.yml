name: Build MobilePilot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobilepilot/project/**'
      - '.github/workflows/build-mobilepilot.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Create Gradle wrapper
        working-directory: mobilepilot/project
        run: gradle wrapper --gradle-version 9.1.0

      - name: Build debug APK
        working-directory: mobilepilot/project
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobilePilot-debug-apk
          path: mobilepilot/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
