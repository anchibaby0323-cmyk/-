name: Build NovaTune APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NovaTune source tree
        shell: bash
        run: |
          cat .novatune/chunk00 .novatune/chunk01 .novatune/chunk02 .novatune/chunk03 .novatune/chunk04 .novatune/chunk05 .novatune/chunk06 .novatune/chunk07 .novatune/c80 .novatune/c81_0 .novatune/c81_1 .novatune/c81_2 .novatune/c81_3 .novatune/chunk09 > novatune_project.tgz.b64
          echo "2b1e68cbde2fb3950a6da8dde3eade741c05f56982c3db4c121c93b8d23d5211  novatune_project.tgz.b64" | sha256sum -c -
          base64 -d novatune_project.tgz.b64 > novatune_project.tgz
          echo "7ca3cb26ce2aa0c42e273b78ac14a13a19654c73bfca63124edc2fe820a61808  novatune_project.tgz" | sha256sum -c -
          tar -xzf novatune_project.tgz
          rm -f novatune_project.tgz novatune_project.tgz.b64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 15 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaTune-Engine-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
