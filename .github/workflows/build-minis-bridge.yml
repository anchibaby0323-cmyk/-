name: Build GPT Gemini Minis Bridge
on:
  push:
    paths: ['AIOS-GPT-Gemini-Minis-Bridge/**', '.github/workflows/build-minis-bridge.yml']
  pull_request:
    paths: ['AIOS-GPT-Gemini-Minis-Bridge/**', '.github/workflows/build-minis-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AIOS-GPT-Gemini-Minis-Bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Gemini-Minis-Bridge-debug
          path: |
            AIOS-GPT-Gemini-Minis-Bridge/app/build/outputs/apk/debug/app-debug.apk
            AIOS-GPT-Gemini-Minis-Bridge/app/build/reports/lint-results-debug.html
            AIOS-GPT-Gemini-Minis-Bridge/README.md
          if-no-files-found: error
