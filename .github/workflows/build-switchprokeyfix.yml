name: Build SwitchProKeyFix APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SwitchProKeyFix/**'
      - '.github/workflows/build-switchprokeyfix.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SwitchProKeyFix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchProKeyFix-debug-apk
          path: SwitchProKeyFix/app/build/outputs/apk/debug/app-debug.apk

# Trigger marker: SwitchProKeyFix v0.3.0 watchdog build
